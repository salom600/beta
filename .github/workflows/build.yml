name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # LINUX
  # -------------------------------------------------------------------
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Apt cache
        uses: actions/cache@v4
        with:
          path: /var/cache/apt
          key: apt-linux-${{ runner.os }}-qt6multimedia-${{ hashFiles('.github/workflows/build.yml') }}
          restore-keys: apt-linux-

      - name: Install Qt6 + build deps + ffmpeg (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-multimedia-dev \
            libqt6multimedia6 libgl1-mesa-dev libegl1-mesa-dev \
            build-essential cmake ninja-build pkg-config \
            libfuse2 ffmpeg

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifacts (with ffmpeg + Qt plugins)
        run: |
          set -eux
          mkdir -p artifact/platforms artifact/multimedia artifact/imageformats artifact/styles artifact/tls artifact/mediaservice artifact/audio
          cp build/app/beta_editor artifact/beta-editor-linux
          chmod +x artifact/beta-editor-linux
          # Find Qt6 plugin dir
          QT_PLUGINS=$(find /usr -name platforms -path "*qt6*" -type d 2>/dev/null | head -1 | xargs dirname)
          if [ -n "$QT_PLUGINS" ]; then
            cp -v $QT_PLUGINS/platforms/*.so   artifact/platforms/ 2>/dev/null || true
            cp -v $QT_PLUGINS/multimedia/*.so  artifact/multimedia/ 2>/dev/null || true
            cp -v $QT_PLUGINS/imageformats/*.so artifact/imageformats/ 2>/dev/null || true
            cp -v $QT_PLUGINS/styles/*.so      artifact/styles/ 2>/dev/null || true
            cp -v $QT_PLUGINS/tls/*.so         artifact/tls/ 2>/dev/null || true
            cp -v $QT_PLUGINS/mediaservice/*.so artifact/mediaservice/ 2>/dev/null || true
            cp -v $QT_PLUGINS/audio/*.so       artifact/audio/ 2>/dev/null || true
          fi
          # Copy Qt6 runtime libs so the bundle runs without apt-installed Qt
          for lib in libQt6Core libQt6Gui libQt6Widgets libQt6Multimedia libQt6MultimediaWidgets libQt6Network libQt6OpenGL libQt6DBus libQt6Svg; do
            cp -v $(ldconfig -p | grep -m1 "$lib.so.6" | awk '{print $NF}') artifact/ 2>/dev/null || true
          done
          # Bundle ffmpeg so export works out of the box
          cp -v $(which ffmpeg) artifact/ffmpeg
          chmod +x artifact/ffmpeg
          # Launcher script: sets up env so the bundle finds Qt + ffmpeg
          cat > artifact/run.sh <<'EOF'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export LD_LIBRARY_PATH="${HERE}:${LD_LIBRARY_PATH}"
          export QT_PLUGIN_PATH="${HERE}"
          export QT_QPA_PLATFORM_PLUGIN_PATH="${HERE}/platforms"
          export BETA_FFMPEG="${HERE}/ffmpeg"
          exec "${HERE}/beta-editor-linux" "$@"
          EOF
          chmod +x artifact/run.sh
          tar -czf beta-editor-linux-x86_64.tar.gz -C artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-editor-linux-x86_64
          path: beta-editor-linux-x86_64.tar.gz
          retention-days: 30

  # -------------------------------------------------------------------
  # WINDOWS
  # -------------------------------------------------------------------
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-2022
    env:
      QT_VERSION: '6.6.3'
      QT_ARCH: 'win64_msvc2019_64'
    steps:
      - uses: actions/checkout@v4

      - name: Cache Qt install
        id: qt-cache
        uses: actions/cache@v4
        with:
          path: ${{ runner.workspace }}\Qt
          key: qt-${{ env.QT_VERSION }}-${{ env.QT_ARCH }}-v2

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: 'qtmultimedia'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Rust cache
        uses: Swatinem/rust-cache@v2
        with:
          workspaces: "engine -> target"

      - name: Cache ffmpeg download
        id: ffmpeg-cache
        uses: actions/cache@v4
        with:
          path: ffmpeg.zip
          key: ffmpeg-release-essentials-7.0-windows

      - name: Download ffmpeg (Windows)
        shell: pwsh
        run: |
          if (-not (Test-Path ffmpeg.zip)) {
            Invoke-WebRequest `
              -Uri "https://www.gyan.dev/ffmpeg/builds/ffmpeg-release-essentials.zip" `
              -OutFile "ffmpeg.zip"
          }
          Expand-Archive -Path ffmpeg.zip -DestinationPath ffmpeg-extract -Force
          $exe = Get-ChildItem -Path ffmpeg-extract -Recurse -Filter "ffmpeg.exe" | Select-Object -First 1
          Copy-Item $exe.FullName -Destination "$env:GITHUB_WORKSPACE\ffmpeg.exe"
          Write-Host "ffmpeg.exe at $env:GITHUB_WORKSPACE\ffmpeg.exe"

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release --parallel

      - name: Zip Windows artifacts (with bundled ffmpeg)
        shell: pwsh
        run: |
          $stage = "beta-editor-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build\app\beta_editor.exe -Destination $stage\beta-editor.exe
          # windeployqt already copied Qt DLLs next to the .exe; bring them all across
          Get-ChildItem build\app -Filter *.dll | ForEach-Object { Copy-Item $_.FullName -Destination $stage }
          Get-ChildItem build\app -Directory | ForEach-Object {
            $dst = Join-Path $stage $_.Name
            New-Item -ItemType Directory -Force -Path $dst | Out-Null
            Copy-Item (Join-Path $_.FullName '*') -Destination $dst -Recurse -Force
          }
          # Bundle ffmpeg.exe next to the editor
          Copy-Item "$env:GITHUB_WORKSPACE\ffmpeg.exe" -Destination $stage\ffmpeg.exe
          # Launcher script that sets BETA_FFMPEG so the editor finds ffmpeg
          @"
          @echo off
          setlocal
          set "HERE=%~dp0"
          set "BETA_FFMPEG=%HERE%ffmpeg.exe"
          set "PATH=%HERE%;%PATH%"
          "%HERE%beta-editor.exe" %*
          "@ | Set-Content -Path "$stage\run.bat" -Encoding ASCII
          Compress-Archive -Path $stage\* -DestinationPath beta-editor-windows-x86_64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-editor-windows-x86_64
          path: beta-editor-windows-x86_64.zip
          retention-days: 30

  # -------------------------------------------------------------------
  # RELEASE
  # -------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: beta-editor-linux-x86_64
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: beta-editor-windows-x86_64
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Beta ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/beta-editor-linux-x86_64.tar.gz
            release/beta-editor-windows-x86_64.zip
