name: Build

on:
  push:
    branches: [main, master]
    tags: ['v*']
  pull_request:
    branches: [main, master]
  workflow_dispatch:

permissions:
  contents: write
  packages: read

concurrency:
  group: build-${{ github.ref }}-${{ github.event_name }}
  cancel-in-progress: true

jobs:
  # -------------------------------------------------------------------
  # LINUX
  # -------------------------------------------------------------------
  build-linux:
    name: Build (Linux x86_64)
    runs-on: ubuntu-22.04
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt6 + build deps (apt)
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends \
            qt6-base-dev qt6-multimedia-dev \
            libqt6multimedia6 \
            libgl1-mesa-dev libegl1-mesa-dev \
            build-essential cmake ninja-build pkg-config \
            libfuse2

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            build/engine
          key: cargo-linux-${{ hashFiles('engine/Cargo.toml', 'engine/src/**') }}
          restore-keys: cargo-linux-

      - name: Configure CMake
        run: cmake -S . -B build -G Ninja -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --config Release --parallel

      - name: Stage artifacts
        run: |
          set -eux
          mkdir -p artifact
          cp build/app/beta_editor artifact/beta-editor-linux
          # Package required Qt plugins into the artifact folder for portability
          mkdir -p artifact/platforms artifact/multimedia artifact/imageformats
          QT_PLUGINS=$(qt6-dir 2>/dev/null || echo /usr/lib/qt6/plugins)
          cp -v ${QT_PLUGINS}/platforms/libqxcb.so artifact/platforms/ 2>/dev/null || true
          cp -v ${QT_PLUGINS}/multimedia/*.so artifact/multimedia/ 2>/dev/null || true
          cp -v ${QT_PLUGINS}/imageformats/*.so artifact/imageformats/ 2>/dev/null || true
          # Write a tiny launcher script that points Qt at the bundled plugins
          cat > artifact/run.sh <<'EOF'
          #!/usr/bin/env bash
          HERE="$(cd "$(dirname "${BASH_SOURCE[0]}")" && pwd)"
          export QT_PLUGIN_PATH="${HERE}"
          exec "${HERE}/beta-editor-linux" "$@"
          EOF
          chmod +x artifact/run.sh
          tar -czf beta-editor-linux-x86_64.tar.gz -C artifact .

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-editor-linux-x86_64
          path: beta-editor-linux-x86_64.tar.gz
          retention-days: 30

  # -------------------------------------------------------------------
  # WINDOWS
  # -------------------------------------------------------------------
  build-windows:
    name: Build (Windows x86_64)
    runs-on: windows-2022
    env:
      QT_VERSION: '6.6.3'
      QT_ARCH: 'win64_msvc2019_64'
    steps:
      - uses: actions/checkout@v4

      - name: Install Qt
        uses: jurplel/install-qt-action@v4
        with:
          version: ${{ env.QT_VERSION }}
          arch: ${{ env.QT_ARCH }}
          modules: 'qtmultimedia'
          cache: true

      - name: Install Rust
        uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-msvc

      - name: Cache cargo
        uses: actions/cache@v4
        with:
          path: |
            ~\.cargo\registry
            ~\.cargo\git
            build\engine
          key: cargo-windows-${{ hashFiles('engine/Cargo.toml','engine/src/**') }}
          restore-keys: cargo-windows-

      - name: Configure CMake
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake -S . -B build -G "Ninja" -DCMAKE_BUILD_TYPE=Release

      - name: Build
        shell: cmd
        run: |
          call "C:\Program Files\Microsoft Visual Studio\2022\Enterprise\VC\Auxiliary\Build\vcvars64.bat"
          cmake --build build --config Release --parallel

      - name: Zip Windows artifacts
        shell: pwsh
        run: |
          $stage = "beta-editor-windows-x86_64"
          New-Item -ItemType Directory -Force -Path $stage | Out-Null
          Copy-Item build\app\beta_editor.exe -Destination $stage\beta-editor.exe
          # windeployqt already copied Qt DLLs next to the .exe; bring everything across
          Get-ChildItem build\app -Filter *.dll | ForEach-Object { Copy-Item $_.FullName -Destination $stage }
          Get-ChildItem build\app -Directory | Where-Object { $_.Name -in @('platforms','multimedia','imageformats','styles','tls','mediaservice','audio') } | ForEach-Object {
            New-Item -ItemType Directory -Force -Path (Join-Path $stage $_.Name) | Out-Null
            Copy-Item (Join-Path $_.FullName '*') -Destination (Join-Path $stage $_.Name) -Recurse -Force
          }
          Compress-Archive -Path $stage\* -DestinationPath beta-editor-windows-x86_64.zip -Force

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: beta-editor-windows-x86_64
          path: beta-editor-windows-x86_64.zip
          retention-days: 30

  # -------------------------------------------------------------------
  # RELEASE
  # -------------------------------------------------------------------
  release:
    name: Publish release
    needs: [build-linux, build-windows]
    runs-on: ubuntu-22.04
    if: startsWith(github.ref, 'refs/tags/v')
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@v4

      - uses: actions/download-artifact@v4
        with:
          name: beta-editor-linux-x86_64
          path: release

      - uses: actions/download-artifact@v4
        with:
          name: beta-editor-windows-x86_64
          path: release

      - name: Create GitHub release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ github.ref_name }}
          name: Beta ${{ github.ref_name }}
          generate_release_notes: true
          files: |
            release/beta-editor-linux-x86_64.tar.gz
            release/beta-editor-windows-x86_64.zip
